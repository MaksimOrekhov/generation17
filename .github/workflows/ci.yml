name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Воспроизводимость аудита имён
        run: |
          npx tsx scripts/names-baseline.ts --samples 5000 --check-samples 100
          git diff --exit-code -- docs/audit/names-baseline-5000.md
      - name: Воспроизводимость аудита автономии NPC
        run: |
          npx tsx scripts/npc-autonomy-diagnostics.ts
          git diff --exit-code -- docs/audit/npc-autonomy-diagnostics.md
      - name: Контент и бандл
        run: npm run content:check
      - name: TypeScript
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
