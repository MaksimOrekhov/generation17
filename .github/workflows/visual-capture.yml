name: Visual capture

# Снимает шесть DEV-fixture кадров настоящего GameScreen и публикует их как artifact.
# Отдельным artifact — пять сравнительных кадров GEN-101 «Живой дом» (контракт шести кадров GEN-100 не меняется).
# Без секретов, права только на чтение; в PR ничего не пишет.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/visual-capture.ts'
      - 'scripts/visual-capture-household.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Снимаем ровно голову PR, а не синтетический merge-коммит; скрипт сверяет git HEAD с CAPTURE_SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture
        # SHA головы PR попадает в manifest и имя artifact; несовпадение с checkout роняет capture.
        env:
          CAPTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run visual:capture
      - name: Ровно шесть PNG и manifest
        run: |
          test "$(ls artifacts/visual-capture/*.png | wc -l)" -eq 6
          test -f artifacts/visual-capture/manifest.json
          test -f artifacts/visual-capture/manifest.md
      - uses: actions/upload-artifact@v4
        with:
          name: gamescreen-visual-capture-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/visual-capture/
          if-no-files-found: error
          retention-days: 14
      - name: GEN-101 · сравнительные кадры «Живой дом»
        env:
          CAPTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run visual:capture:household
      - name: Ровно пять PNG и manifest
        run: |
          test "$(ls artifacts/visual-capture-household/*.png | wc -l)" -eq 5
          test -f artifacts/visual-capture-household/manifest.json
          test -f artifacts/visual-capture-household/manifest.md
      - uses: actions/upload-artifact@v4
        with:
          name: gamescreen-household-capture-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/visual-capture-household/
          if-no-files-found: error
          retention-days: 14
